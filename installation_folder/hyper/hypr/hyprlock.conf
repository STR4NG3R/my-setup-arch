general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = /tmp/lockscreen.png
    blur_passes = 3
    blur_size = 5
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 45
    outline_thickness = 1
    rounding = 12
    dots_size = 0.2
    dots_spacing = 0.4
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(30, 30, 30, 0.6)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <i>Contraseña...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
